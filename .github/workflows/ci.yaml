name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m tools.ruff_plugins.tenant_check .

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
      - run: uv sync --all-packages --dev
      - run: uv run mypy packages

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
      - run: uv sync --all-packages --dev
      - run: uv run pytest -m unit

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kortex
          POSTGRES_PASSWORD: kortex
          POSTGRES_DB: kortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kortex -d kortex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KORTEX_DATABASE_URL: postgresql+asyncpg://kortex:kortex@localhost:5432/kortex
      KORTEX_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
      - run: uv sync --all-packages --dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration
