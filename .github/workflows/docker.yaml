name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build (without pushing) on PRs. Until this was added nothing validated a
  # Dockerfile until after it had already merged to main.
  pull_request:
    paths:
      - "docker/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: kortex-api,    dockerfile: docker/api.Dockerfile }
          - { image: kortex-mcp,    dockerfile: docker/mcp.Dockerfile }
          - { image: kortex-worker, dockerfile: docker/worker.Dockerfile }
          - { image: kortex-web,    dockerfile: docker/web.Dockerfile }
          - { image: kortex-local,  dockerfile: docker/local.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The all-in-one image carries Postgres, Redis and the torch-backed
      # embedding stack; the default runner image leaves too little room.
      - name: Free runner disk space
        if: matrix.image == 'kortex-local'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          REPO=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF##*/v}"
            echo "tags=${REPO}:${VERSION},${REPO}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REPO}:main,${REPO}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
