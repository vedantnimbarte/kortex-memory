[project]
name = "kortex-memory"
version = "0.1.0"
description = "Production-grade multi-tenant memory layer for LLMs and AI coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/kortex-web"]

[tool.uv.sources]
kortex-core = { workspace = true }
kortex-api = { workspace = true }
kortex-mcp = { workspace = true }
kortex-cli = { workspace = true }
kortex-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis,minio]>=4.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "vcrpy>=6.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "N", "S", "C4", "ASYNC", "RUF",
    "SIM", "PT", "TID", "ARG", "PIE", "PL", "ERA",
]
ignore = [
    "S101",    # assert (used in tests)
    "PLR0913", # too many args (DI)
    "PLR2004", # magic numbers (test code)
    "B008",    # call in default arg (FastAPI Depends)
    # --- Deliberate codebase patterns (reviewed) ---
    "PLC0415", # function-level imports: optional deps (stripe/redis/celery) +
               # circular-import avoidance are intentional throughout.
    "PLW0603", # module-singleton `global` (lazy redis/otel clients).
    "S110",    # try/except/pass: fail-open on telemetry/cache paths by design.
    "SIM105",  # explicit try/except/pass over contextlib.suppress in hot paths.
    "SIM115",  # manual open()/close for tar + streaming bodies.
    "PLW0108", # lambda wrappers used for DI defaults / clarity.
    "S105", "S106", "S107",  # false positives: jwt claim names, dev defaults.
    "S608",    # raw SQL is parameterized with bound params (hybrid search).
    "S603", "S607",  # subprocess in operator-run scripts.
    "RUF002",  # en-dash / unicode in docstrings.
    "PLW2901", # loop-var reassignment (readability).
    "PLR0911", "PLR0912", "PLR0915",  # complexity in planners/validators.
    "UP042",   # keep `str, Enum` (StrEnum __str__ differs; would change output).
    "UP046",   # keep `Generic[T]` subclass form for clarity.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PL", "ARG", "PT"]
"alembic/**/*.py" = ["E501", "S"]
"scripts/**/*.py" = ["S", "PL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
# disallow_any_explicit is impractical with the pydantic.mypy plugin, which
# synthesizes Any-typed validators on every model — it flagged 140+ generated
# Anys with no user-fixable cause. Keep the rest of strict; allow explicit Any.
disallow_any_explicit = false
disallow_any_generics = false
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/fixtures/"]

[[tool.mypy.overrides]]
# Untyped third-party libs (no stubs) — don't flag their calls/decorators.
module = [
    "testcontainers.*", "celery.*", "kombu.*", "hdbscan.*",
    "stripe.*", "redis.*", "numpy", "numpy.*", "mcp.*",
    "aiobotocore.*", "anthropic.*", "openai.*", "sentence_transformers.*",
    "docx", "docx.*", "pymupdf", "FlagEmbedding", "FlagEmbedding.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Modules whose surface is dominated by untyped SDK decorators/calls (celery
# @task, the MCP server, Stripe/Redis clients). The resulting untyped-decorator /
# no-untyped-call noise has no local fix, so suppress just those codes.
module = [
    "kortex_worker.*",
    "kortex_mcp.*",
    "kortex_core.services.billing_service",
    "kortex_core.security.token_denylist",
    "kortex_core.security.quota",
    "kortex_api.routers.billing",
    "kortex_api.routers.admin",
    "kortex_api.middleware.ratelimit",
    "kortex_api.middleware.idempotency",
]
disable_error_code = [
    "no-untyped-call", "no-any-return", "no-untyped-def", "untyped-decorator",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring testcontainers",
    "e2e: end-to-end tests requiring full stack",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/migrations/*", "alembic/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
