[project]
name = "kortex-memory"
version = "0.1.0"
description = "Production-grade multi-tenant memory layer for LLMs and AI coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kortex-core = { workspace = true }
kortex-api = { workspace = true }
kortex-mcp = { workspace = true }
kortex-cli = { workspace = true }
kortex-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis,minio]>=4.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "vcrpy>=6.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "N", "S", "C4", "ASYNC", "RUF",
    "SIM", "PT", "TID", "ARG", "PIE", "PL", "ERA",
]
ignore = [
    "S101",   # assert (used in tests)
    "PLR0913", # too many args (DI)
    "PLR2004", # magic numbers (test code)
    "B008",   # call in default arg (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PL", "ARG"]
"alembic/**/*.py" = ["E501", "S"]
"scripts/**/*.py" = ["S", "PL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "celery.*", "kombu.*", "hdbscan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring testcontainers",
    "e2e: end-to-end tests requiring full stack",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/migrations/*", "alembic/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
