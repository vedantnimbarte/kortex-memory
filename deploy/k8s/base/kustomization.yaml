apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base composes the Helm chart with default values. Overlays customize via
# helmCharts.valuesInline. Operators may also vendor a rendered chart here.

helmCharts:
  - name: kortex
    releaseName: kortex
    namespace: kortex
    path: ../../helm/kortex
    valuesFile: ../../helm/kortex/values.yaml
