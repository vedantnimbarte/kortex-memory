{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kortex.fullname" . }}-api
  labels:
    {{- include "kortex.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          # API surfaces route to the api service; everything else is the SPA.
          {{- range $p := list "/v1" "/health" "/readyz" "/livez" "/metrics" }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "kortex.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kortex.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
  tls:
    - hosts:
        - {{ .Values.api.ingress.host }}
      secretName: {{ .Values.api.ingress.tlsSecret }}
{{- end }}
