apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kortex.fullname" . }}-mcp
  labels:
    {{- include "kortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "kortex.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "kortex.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: mcp
          image: {{ include "kortex.image" (dict "Values" .Values "repo" .Values.image.mcp.repository "tag" .Values.image.mcp.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["kortex-mcp", "serve", "--host", "0.0.0.0", "--port", "8765"]
          ports:
            - name: http
              containerPort: 8765
          env:
            {{- include "kortex.envCommon" . | nindent 12 }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kortex.fullname" . }}-mcp
  labels:
    {{- include "kortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "kortex.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
