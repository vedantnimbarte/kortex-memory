site_name: Kortex Memory
site_description: Production-grade memory layer for LLMs and AI coding agents.
site_url: https://kortex-memory.dev
repo_url: https://github.com/vedantnimbarte/kortex-memory
repo_name: kortex-memory

# Internal strategy documents. They live beside the docs for convenience but
# must never reach the published site — they contain competitor critique and
# pricing positioning. Excluded here rather than relying on the nav, because
# mkdocs publishes every page it finds in docs_dir, nav membership or not.
exclude_docs: |
  market-research.md
  implementation-plan.md
  distribution.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Portability: portability.md
  - Integrations:
      - Claude Code: integrations/claude-code.md
      - Cursor: integrations/cursor.md
      - Codex: integrations/codex.md
      - OpenCode: integrations/opencode.md
  - Architecture:
      - Overview: architecture/overview.md
      - ADRs:
          - 0001 Choose pgvector + HNSW: architecture/adr/0001-pgvector-hnsw.md
          - 0002 Agentic retrieval over LLM-only: architecture/adr/0002-agentic-retrieval.md
          - 0003 Pluggable skills: architecture/adr/0003-pluggable-skills.md
  - Developers:
      - Setup: developers/setup.md
      - Testing: developers/testing.md
  - API:
      - REST: api/rest.md
      - Python SDK: api/python.md
      - TypeScript SDK: api/typescript.md
      - MCP: api/mcp.md
      - Claude memory tool: api/memory-tool.md
  - Operators:
      - Deploy: operators/deploy.md
      - Scale: operators/scale.md
      - Backup: operators/backup.md
      - Rotate keys: operators/rotate-keys.md
      - Runbooks: operators/runbooks.md
