; Supervisor config for the all-in-one image.
;
; Owns the four Python processes only. Postgres and Redis are started by the
; entrypoint, which needs them up before migrations run — see entrypoint.sh.
;
; Everything logs to stdout/stderr so `docker logs` is the single place to
; look, which is the whole point of a one-container image.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
command=uv run --frozen --no-dev kortex-api
directory=/app
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:mcp]
command=uv run --frozen --no-dev kortex-mcp serve --host 0.0.0.0 --port 8765
directory=/app
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:worker]
command=uv run --frozen --no-dev kortex-worker worker
directory=/app
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=30

[program:beat]
command=uv run --frozen --no-dev kortex-worker beat
directory=/app
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=40
