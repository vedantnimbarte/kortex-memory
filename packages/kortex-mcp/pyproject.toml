[project]
name = "kortex-mcp"
version = "0.1.0"
description = "Kortex memory MCP server (stdio + SSE)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]

dependencies = [
    "kortex-core",
    "mcp>=1.1.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
kortex-mcp = "kortex_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kortex_mcp"]
