[project]
name = "kortex-worker"
version = "0.1.0"
description = "Kortex memory background worker (Celery)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]

dependencies = [
    "kortex-core",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.optional-dependencies]
# Convenience aggregator — install with `kortex-worker[full]` to pull in the
# embedding model + attachment processing libs needed by background tasks.
full = [
    "kortex-core[embeddings-local,attachments,clustering,storage-s3]",
]

[project.scripts]
kortex-worker = "kortex_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kortex_worker"]
