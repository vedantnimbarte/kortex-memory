[project]
name = "kortex-core"
version = "0.1.0"
description = "Kortex memory core: domain models, repositories, services, retrieval, skills"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]

dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "python-ulid>=3.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "redis>=5.0.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
embeddings-local = ["sentence-transformers>=3.1.0", "torch>=2.4.0", "numpy>=2.0.0"]
embeddings-openai = ["openai>=1.50.0"]
embeddings-voyage = ["voyageai>=0.2.0"]
embeddings-cohere = ["cohere>=5.0.0"]
llm-anthropic = ["anthropic>=0.40.0"]
llm-openai = ["openai>=1.50.0"]
storage-s3 = ["aiobotocore>=2.15.0", "botocore>=1.35.0"]
attachments = ["pymupdf>=1.24.0", "python-docx>=1.1.0", "pypandoc>=1.13"]
clustering = ["hdbscan>=0.8.38", "scikit-learn>=1.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kortex_core"]
