[project]
name = "kortex-api"
version = "0.1.0"
description = "Kortex memory REST API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]

dependencies = [
    "kortex-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.10",
    # EmailStr in the user schemas requires the validator backend at schema-build
    # time; without it create_app() fails to boot.
    "pydantic[email]>=2.9.0",
    "prometheus-client>=0.20.0",
    "stripe>=11.0.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asgi>=0.48b0",
]

[project.scripts]
kortex-api = "kortex_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kortex_api"]
