[project]
name = "kortex"
version = "0.1.0"
description = "Python client for Kortex Memory — a memory layer for LLMs and AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Kortex Memory" }]
keywords = ["memory", "llm", "agents", "rag", "kortex"]

# httpx and nothing else, deliberately. An SDK that drags in SQLAlchemy,
# pgvector and a sentence-transformers build to send JSON over HTTP is a tax on
# every integrator. This package never imports kortex_core.
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/vedantnimbarte/kortex-memory"
Documentation = "https://github.com/vedantnimbarte/kortex-memory/tree/main/docs"
Source = "https://github.com/vedantnimbarte/kortex-memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kortex"]
